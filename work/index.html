<script>
/* Tabs and cards both render from assets/work.js. Categories are derived,
   so a new project with a new category adds its own tab automatically. */
/* Same reasoning as the homepage rail: show the poster frame here, not an
   autoplaying video - the archive can list many projects on screen at once. */
function shot(w) {
  /* An explicit cover wins over the hero: it is the one frame chosen to
     represent the brand, rather than whatever the case study opens on. */
  var cover = w.images && w.images.cover;
  if (cover) {
    /* If a cover file is missing or fails to decode, fall back to the hero
       frame rather than leaving a broken image in the rail. */
    var fb = (w.images && (w.images.heroPoster || w.images.hero)) || '';
    var onerr = fb ? ' onerror="this.onerror=null;this.src=\'../' + fb + '\'"' : '';
    return '<img class="shot" src="../' + cover + '" alt="' + w.title.replace(/"/g, '&quot;') +
      '" loading="lazy" decoding="async" data-par="7"' + onerr + '>';
  }
  var src = w.images && w.images.hero;
  var poster = w.images && w.images.heroPoster;
  if (!src) return '<div class="slot" data-spec="Case image" data-par="7"></div>';
  var isVideo = /\.(mp4|webm|mov|m4v)$/i.test(src);
  if (isVideo && !poster) {
    return '<video class="shot" src="../' + src + '" muted playsinline preload="metadata" data-par="7"></video>';
  }
  var img = isVideo ? poster : src;
  return '<img class="shot" src="../' + img + '" alt="' + w.title.replace(/"/g, '&quot;') +
    '" loading="lazy" decoding="async" data-par="7">';
}
(function () {
  var W = window.VAELO_WORK, cats = [];
  W.forEach(function (w) { if (cats.indexOf(w.cat) === -1) cats.push(w.cat); });

  document.getElementById('tabs').innerHTML =
    '<button class="tab-btn on" role="tab" aria-selected="true" data-cat="all">All<span class="c">' + W.length + '</span></button>' +
    cats.map(function (c) {
      var n = W.filter(function (w) { return w.cat === c; }).length;
      return '<button class="tab-btn" role="tab" aria-selected="false" data-cat="' + c + '">' + c + '<span class="c">' + n + '</span></button>';
    }).join('');

  function tags(w) {
    var list = [w.cat].concat(w.scope.split('+').map(function (s) { return s.trim(); }));
    var seen = {};
    return list.filter(function (t) { return t && !seen[t.toLowerCase()] && (seen[t.toLowerCase()] = 1); })
      .map(function (t) { return '<span class="pill">' + t + '</span>'; }).join('');
  }
  /* A caption bar carries the project's own colour, so the grid reads as a
     set of brands rather than a set of thumbnails. Whether the type on it
     is black or off-white is decided from the colour's luminance rather
     than guessed, so a light tone never gets light text on it. */
  function ink(hex) {
    var c = hex.replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    var f = function (i) {
      var v = parseInt(c.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return (0.2126 * f(0) + 0.7152 * f(2) + 0.0722 * f(4)) > 0.35 ? '#0a0a0a' : '#f4f2ec';
  }

  document.getElementById('arch').innerHTML = W.map(function (w) {
    var tone = w.tone || '#1b1b19';
    return '<a class="arch-item" data-rev data-cat="' + w.cat + '" href="' + w.slug + '.html"' +
      ' style="--tone:' + tone + ';--ink:' + ink(tone) + '">' +
      '<div class="frame">' + shot(w) + '<div class="veil"></div></div>' +
      '<div class="bar">' +
        '<div class="bar-txt"><h3>' + w.title + '</h3>' +
          '<div class="tags">' + tags(w) + '</div></div>' +
        '<span class="see">See case</span>' +
      '</div></a>';
  }).join('');
})();
</script>
